<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">VoteScope confirme une victoire libérale à Terrebonne</title>
  <desc id="desc">Visuel carré pour médias sociaux annonçant que Tatiana Auguste et les libéraux ont gagné Terrebonne, selon le résultat confirmé suivi par VoteScope.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="60%" stop-color="#111726"/>
      <stop offset="100%" stop-color="#1a2438"/>
    </linearGradient>
    <radialGradient id="glowRed" cx="0.15" cy="0.15" r="0.7">
      <stop offset="0%" stop-color="#ff7f7f" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff7f7f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="0.9" cy="0.9" r="0.8">
      <stop offset="0%" stop-color="#f0d27a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f0d27a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" fill="url(#glowRed)"/>
  <rect width="1200" height="1200" fill="url(#glowGold)"/>

  <g transform="translate(86 76)">
    <rect x="0" y="0" width="255" height="46" rx="23" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="24" y="29" fill="#f0d27a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="2">VOTESCOPE · RÉSULTAT CONFIRMÉ</text>

    <text x="0" y="170" fill="#edf2fb" font-family="Georgia, Times New Roman, serif" font-size="102" font-weight="700">Terrebonne</text>
    <text x="0" y="290" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="800">Victoire libérale confirmée</text>
    <text x="0" y="370" fill="#c8d2e3" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">Tatiana Auguste gagne Terrebonne</text>

    <g transform="translate(0 454)" filter="url(#shadow)">
      <rect x="0" y="0" width="1028" height="286" rx="34" fill="rgba(12,18,32,0.78)" stroke="rgba(255,255,255,0.12)"/>
      <text x="42" y="72" fill="#9aa6bd" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="1.2">MISE À JOUR FINALE SUIVIE</text>

      <text x="42" y="154" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="84" font-weight="800">48,4%  LIB</text>
      <text x="502" y="154" fill="#f3f5f8" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700">vs 46,9% BQ</text>

      <text x="42" y="226" fill="#f0d27a" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800">+641 voix</text>
      <text x="326" y="226" fill="#c8d2e3" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">avec 93,8% des bureaux dépouillés</text>
    </g>

    <text x="0" y="828" fill="#c8d2e3" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="600">VoteScope a correctement anticipé cette victoire</text>
    <text x="0" y="886" fill="#c8d2e3" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="600">libérale dans la seule vraie course serrée</text>
    <text x="0" y="944" fill="#c8d2e3" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="600">des partielles fédérales du 13 avril.</text>

    <text x="0" y="1040" fill="#9aa6bd" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">vote-scope.com</text>
    <text x="748" y="1040" fill="#9aa6bd" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Résultat suivi · 13 avril 2026</text>
  </g>
</svg>
